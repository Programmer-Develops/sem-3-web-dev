<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.socket.io/4.8.4/socket.io.min.js" integrity="sha384-fBrXvbDtHoeKWJ/hcA6M+YGueiDW+h45I7V6F2kD1S8bOkrF9rZYPLVkCR6BLR/1" crossorigin="anonymous"></script>
</head>
<body>
    <h1>Welcome to socket.io client side</h1>
</body>
</html>

<script>
    const socket = io('ws://localhost:3000/',{
        "transports": ["websocket"]
    })

    // sending data to server
    socket.emit("reading", "Hello World from client side");

    // reading data from server
    socket.on("sending", (data) => {
        console.log("Data from server: ", data);
    })

    socket.on("join", (data) => {
        console.log(data);
    })

    socket.on("announcement", (data) => {
        console.log(data);
    })

</script>
